name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and scripts
        id: metadata
        run: |
          python -m unittest discover -s scripts/tests
          python scripts/release.py metadata
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check shared core and CLI
        working-directory: packages/eams_core
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test
          dart run bin/eams.dart --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser login extraction
        run: node --test scripts/test_browser_login.mjs
      - name: Check GUI
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Check lockfiles were preserved
        run: git diff --exit-code -- app/pubspec.lock packages/eams_core/pubspec.lock

  android:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/eams-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python scripts/release.py signing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build signed APKs and AAB
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: Package Android
        run: python scripts/release.py package android
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: python scripts/release.py clean-signing

  desktop:
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: ubuntu-24.04
            target: linux
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev libjsoncpp-dev
      - name: Build desktop GUI
        working-directory: app
        env:
          TARGET: ${{ matrix.target }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build "$TARGET" --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: Compile CLI
        working-directory: packages/eams_core
        run: |
          dart pub get --enforce-lockfile
          mkdir -p build
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          dart compile exe -D EAMS_VERSION="$VERSION" bin/eams.dart -o "build/eams$suffix"
          "./build/eams$suffix" --version
          "./build/eams$suffix" --help
      - name: Package GUI and CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/release.py package "$TARGET"
          python scripts/release.py package cli
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  web:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Web
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - run: python scripts/release.py package web
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, android, desktop, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and calculate checksums
        run: python scripts/release.py checksums
      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ECNU EAMS Client ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: docs/release-notes.md
          files: dist/*
      - name: Publish after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
